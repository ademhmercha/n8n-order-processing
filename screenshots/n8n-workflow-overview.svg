<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Inter', -apple-system, sans-serif">
  <rect width="900" height="500" fill="#1a1a2e" rx="8"/>
  <rect x="0" y="0" width="900" height="44" fill="#16162a" rx="8"/>
  <rect x="0" y="36" width="900" height="8" fill="#16162a"/>
  <circle cx="20" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="22" r="6" fill="#27c93f"/>
  <text x="450" y="28" text-anchor="middle" fill="#888" font-size="13" font-weight="500">n8n — order-processing-workflow</text>

  <!-- Workflow pipeline -->
  <rect x="30" y="70" width="140" height="50" rx="8" fill="#2d2d5e" stroke="#4f46e5" stroke-width="2"/>
  <text x="100" y="92" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">🔄 Webhook</text>
  <text x="100" y="108" text-anchor="middle" fill="#aaa" font-size="10">POST /order-processing</text>

  <line x1="170" y1="95" x2="200" y2="95" stroke="#4f46e5" stroke-width="2"/>
  <polygon points="200,90 210,95 200,100" fill="#4f46e5"/>

  <rect x="220" y="70" width="140" height="50" rx="8" fill="#2d2d5e" stroke="#f59e0b" stroke-width="2"/>
  <text x="290" y="92" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">📝 Validate</text>
  <text x="290" y="108" text-anchor="middle" fill="#aaa" font-size="10">Code Node</text>

  <line x1="360" y1="95" x2="390" y2="95" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="390,90 400,95 390,100" fill="#f59e0b"/>

  <rect x="410" y="70" width="140" height="50" rx="8" fill="#2d2d5e" stroke="#22c55e" stroke-width="2"/>
  <text x="480" y="92" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">🗄️ Check Stock</text>
  <text x="480" y="108" text-anchor="middle" fill="#aaa" font-size="10">Postgres SELECT</text>

  <line x1="550" y1="95" x2="580" y2="95" stroke="#22c55e" stroke-width="2"/>
  <polygon points="580,90 590,95 580,100" fill="#22c55e"/>

  <rect x="600" y="70" width="140" height="50" rx="8" fill="#2d2d5e" stroke="#8b5cf6" stroke-width="2"/>
  <text x="670" y="92" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">🔀 Merge</text>
  <text x="670" y="108" text-anchor="middle" fill="#aaa" font-size="10">Code Node</text>

  <line x1="740" y1="95" x2="770" y2="95" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="770,90 780,95 770,100" fill="#8b5cf6"/>

  <rect x="790" y="70" width="80" height="50" rx="8" fill="#2d2d5e" stroke="#ef4444" stroke-width="2"/>
  <text x="830" y="92" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">❓ IF</text>
  <text x="830" y="108" text-anchor="middle" fill="#aaa" font-size="10">Stock ≥ Qty?</text>

  <!-- TRUE branch -->
  <line x1="830" y1="120" x2="830" y2="150" stroke="#22c55e" stroke-width="2"/>
  <text x="840" y="140" fill="#22c55e" font-size="11" font-weight="600">✅ YES</text>

  <rect x="740" y="155" width="160" height="40" rx="6" fill="#1a3a2a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="820" y="175" text-anchor="middle" fill="#fff" font-size="11" font-weight="500">📦 Reserve Stock</text>
  <text x="820" y="188" text-anchor="middle" fill="#aaa" font-size="9">UPDATE stock_quantity</text>

  <line x1="820" y1="195" x2="820" y2="210" stroke="#22c55e" stroke-width="1.5"/>
  <polygon points="815,210 820,218 825,210" fill="#22c55e"/>

  <rect x="740" y="222" width="160" height="40" rx="6" fill="#1a3a2a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="820" y="242" text-anchor="middle" fill="#fff" font-size="11" font-weight="500">📄 Generate Invoice</text>
  <text x="820" y="255" text-anchor="middle" fill="#aaa" font-size="9">Code Node</text>

  <line x1="820" y1="262" x2="820" y2="277" stroke="#22c55e" stroke-width="1.5"/>
  <polygon points="815,277 820,285 825,277" fill="#22c55e"/>

  <rect x="740" y="289" width="160" height="40" rx="6" fill="#1a3a2a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="820" y="309" text-anchor="middle" fill="#fff" font-size="11" font-weight="500">📁 Save Invoice</text>
  <text x="820" y="322" text-anchor="middle" fill="#aaa" font-size="9">INSERT into invoices</text>

  <line x1="820" y1="329" x2="820" y2="344" stroke="#22c55e" stroke-width="1.5"/>
  <polygon points="815,344 820,352 825,344" fill="#22c55e"/>

  <rect x="740" y="356" width="160" height="40" rx="6" fill="#1a3a2a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="820" y="376" text-anchor="middle" fill="#fff" font-size="11" font-weight="500">🏭 Warehouse Task</text>
  <text x="820" y="389" text-anchor="middle" fill="#aaa" font-size="9">INSERT warehouse_tasks</text>

  <line x1="820" y1="396" x2="820" y2="411" stroke="#22c55e" stroke-width="1.5"/>
  <polygon points="815,411 820,419 825,411" fill="#22c55e"/>

  <rect x="740" y="423" width="160" height="40" rx="6" fill="#1a3a2a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="820" y="443" text-anchor="middle" fill="#fff" font-size="11" font-weight="500">🔔 Notification</text>
  <text x="820" y="456" text-anchor="middle" fill="#aaa" font-size="9">INSERT notifications</text>

  <!-- FALSE branch -->
  <line x1="830" y1="120" x2="830" y2="150" stroke="#22c55e" stroke-width="2"/>
  <line x1="830" y1="150" x2="450" y2="150" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="460" y="143" fill="#ef4444" font-size="11" font-weight="600">❌ NO</text>

  <line x1="450" y1="150" x2="450" y2="180" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="445,180 450,188 455,180" fill="#ef4444"/>

  <rect x="370" y="192" width="160" height="40" rx="6" fill="#2a1a1a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="450" y="212" text-anchor="middle" fill="#fff" font-size="11" font-weight="500">❌ Order Failed</text>
  <text x="450" y="225" text-anchor="middle" fill="#aaa" font-size="9">UPDATE status = 'failed'</text>

  <line x1="450" y1="232" x2="450" y2="247" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="445,247 450,255 455,247" fill="#ef4444"/>

  <rect x="370" y="259" width="160" height="40" rx="6" fill="#2a1a1a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="450" y="279" text-anchor="middle" fill="#fff" font-size="11" font-weight="500">🚫 Respond Error</text>
  <text x="450" y="292" text-anchor="middle" fill="#aaa" font-size="9">409 — Insufficient stock</text>

  <!-- Success response -->
  <rect x="30" y="220" width="230" height="60" rx="8" fill="#1a3a2a" stroke="#22c55e" stroke-width="2"/>
  <text x="145" y="245" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="700">✅ Respond — Success</text>
  <text x="145" y="262" text-anchor="middle" fill="#ccc" font-size="10">200 — { success: true, order: {...} }</text>

  <line x1="260" y1="250" x2="370" y2="280" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6,3"/>

  <rect x="30" y="310" width="230" height="60" rx="8" fill="#2a1a1a" stroke="#ef4444" stroke-width="2"/>
  <text x="145" y="335" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="700">🚫 Respond — Failure</text>
  <text x="145" y="352" text-anchor="middle" fill="#ccc" font-size="10">409 — { success: false, message: "..." }</text>

  <line x1="260" y1="340" x2="370" y2="299" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Legend -->
  <rect x="30" y="420" width="12" height="12" rx="3" fill="#22c55e"/>
  <text x="48" y="431" fill="#aaa" font-size="11">Success flow</text>
  <rect x="140" y="420" width="12" height="12" rx="3" fill="#ef4444"/>
  <text x="158" y="431" fill="#aaa" font-size="11">Failure flow</text>
  <rect x="250" y="420" width="12" height="12" rx="3" fill="#f59e0b"/>
  <text x="268" y="431" fill="#aaa" font-size="11">Code node</text>
  <rect x="350" y="420" width="12" height="12" rx="3" fill="#22c55e"/>
  <text x="368" y="431" fill="#aaa" font-size="11">Postgres node</text>
</svg>
