<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Inter', -apple-system, sans-serif">
  <rect width="520" height="320" fill="#1a1a2e" rx="8"/>
  <rect x="0" y="0" width="520" height="44" fill="#16162a" rx="8"/>
  <rect x="0" y="36" width="520" height="8" fill="#16162a"/>
  <circle cx="20" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="22" r="6" fill="#27c93f"/>
  <text x="260" y="28" text-anchor="middle" fill="#888" font-size="13" font-weight="500">n8n — IF Node Configuration</text>

  <rect x="30" y="60" width="460" height="240" rx="10" fill="#252547" stroke="#3d3d6b" stroke-width="1"/>

  <text x="260" y="88" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">IF</text>
  <text x="260" y="104" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="600">Conditional Branch</text>

  <line x1="50" y1="118" x2="470" y2="118" stroke="#3d3d6b" stroke-width="1"/>

  <text x="50" y="145" fill="#ccc" font-size="13" font-weight="500">Condition</text>

  <!-- First parameter -->
  <rect x="50" y="155" width="140" height="36" rx="6" fill="#1e1e3a" stroke="#4f46e5" stroke-width="2"/>
  <text x="120" y="178" text-anchor="middle" fill="#fff" font-size="13" font-weight="500">inStock</text>

  <!-- Operator -->
  <rect x="205" y="155" width="100" height="36" rx="6" fill="#1e1e3a" stroke="#22c55e" stroke-width="2"/>
  <text x="255" y="178" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="700">===</text>

  <!-- Second parameter -->
  <rect x="320" y="155" width="150" height="36" rx="6" fill="#1e1e3a" stroke="#4f46e5" stroke-width="2"/>
  <text x="395" y="178" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="600">true</text>

  <line x1="50" y1="205" x2="470" y2="205" stroke="#3d3d6b" stroke-width="1"/>

  <!-- TRUE branch -->
  <rect x="50" y="215" width="180" height="36" rx="6" fill="#1a3a2a" stroke="#22c55e" stroke-width="2"/>
  <text x="80" y="233" fill="#22c55e" font-size="12" font-weight="600">✅ TRUE branch:</text>
  <text x="80" y="246" fill="#ccc" font-size="11">Continue → Reserve Stock</text>
  <line x1="235" y1="233" x2="255" y2="233" stroke="#22c55e" stroke-width="2"/>
  <polygon points="255,228 265,233 255,238" fill="#22c55e"/>

  <!-- FALSE branch -->
  <rect x="290" y="215" width="180" height="36" rx="6" fill="#2a1a1a" stroke="#ef4444" stroke-width="2"/>
  <text x="320" y="233" fill="#ef4444" font-size="12" font-weight="600">❌ FALSE branch:</text>
  <text x="320" y="246" fill="#ccc" font-size="11">Fail → Update order failed</text>
  <line x1="275" y1="233" x2="285" y2="233" stroke="#ef4444" stroke-width="2"/>
  <polygon points="275,228 265,233 275,238" fill="#ef4444"/>
</svg>
