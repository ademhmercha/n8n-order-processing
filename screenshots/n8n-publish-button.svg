<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" font-family="'Inter', -apple-system, sans-serif">
  <rect width="520" height="200" fill="#1a1a2e" rx="8"/>

  <!-- Editor toolbar -->
  <rect x="0" y="0" width="520" height="56" fill="#16162a" rx="8"/>
  <rect x="0" y="48" width="520" height="8" fill="#16162a"/>

  <text x="30" y="34" fill="#888" font-size="13" font-weight="500">order-processing-workflow</text>

  <!-- Publish button -->
  <rect x="360" y="14" width="70" height="32" rx="6" fill="#22c55e"/>
  <text x="395" y="35" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Publish</text>

  <!-- Inactive state -->
  <rect x="30" y="80" width="220" height="50" rx="8" fill="#2d2d5e" stroke="#3d3d6b" stroke-width="1"/>
  <circle cx="55" cy="105" r="6" fill="#ef4444"/>
  <text x="70" y="100" fill="#fff" font-size="14" font-weight="600">Workflow Inactive</text>
  <text x="70" y="118" fill="#aaa" font-size="11">Test URL: click "Listen" to activate</text>

  <!-- Arrow -->
  <line x1="255" y1="105" x2="290" y2="105" stroke="#22c55e" stroke-width="2"/>
  <polygon points="290,100 302,105 290,110" fill="#22c55e"/>

  <text x="275" y="95" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">Click</text>

  <!-- Active state -->
  <rect x="305" y="80" width="180" height="50" rx="8" fill="#1a3a2a" stroke="#22c55e" stroke-width="2"/>
  <circle cx="330" cy="105" r="6" fill="#22c55e"/>
  <circle cx="330" cy="105" r="3" fill="#1a3a2a"/>
  <text x="345" y="100" fill="#22c55e" font-size="14" font-weight="600">Workflow Published</text>
  <text x="345" y="118" fill="#aaa" font-size="11">Production URL active 24/7</text>

  <!-- Note -->
  <rect x="30" y="150" width="460" height="35" rx="6" fill="#2a1a1a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="172" fill="#ef4444" font-size="12">⚠️ Backend uses production URL. Workflow MUST be published.</text>
</svg>
