<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" font-family="'Inter', -apple-system, sans-serif">
  <rect width="520" height="600" fill="#1a1a2e" rx="8"/>
  <rect x="0" y="0" width="520" height="44" fill="#16162a" rx="8"/>
  <rect x="0" y="36" width="520" height="8" fill="#16162a"/>
  <circle cx="20" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="22" r="6" fill="#27c93f"/>
  <text x="260" y="28" text-anchor="middle" fill="#888" font-size="13" font-weight="500">n8n — PostgreSQL Credential</text>

  <!-- Modal box -->
  <rect x="30" y="60" width="460" height="520" rx="10" fill="#252547" stroke="#3d3d6b" stroke-width="1"/>

  <text x="260" y="90" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">PostgreSQL Credential</text>
  <text x="260" y="108" text-anchor="middle" fill="#aaa" font-size="12">Connect to Supabase PostgreSQL Database</text>

  <line x1="50" y1="122" x2="470" y2="122" stroke="#3d3d6b" stroke-width="1"/>

  <!-- Host -->
  <text x="50" y="150" fill="#ccc" font-size="13" font-weight="500">Host</text>
  <rect x="50" y="157" width="420" height="36" rx="6" fill="#1e1e3a" stroke="#4f46e5" stroke-width="2"/>
  <text x="65" y="180" fill="#fff" font-size="13">aws-0-eu-west-1.pooler.supabase.com</text>

  <!-- Port -->
  <text x="50" y="215" fill="#ccc" font-size="13" font-weight="500">Port</text>
  <rect x="50" y="222" width="420" height="36" rx="6" fill="#1e1e3a" stroke="#4f46e5" stroke-width="2"/>
  <text x="65" y="245" fill="#fff" font-size="13">6543</text>

  <!-- Database -->
  <text x="50" y="280" fill="#ccc" font-size="13" font-weight="500">Database</text>
  <rect x="50" y="287" width="420" height="36" rx="6" fill="#1e1e3a" stroke="#4f46e5" stroke-width="2"/>
  <text x="65" y="310" fill="#fff" font-size="13">postgres</text>

  <!-- User -->
  <text x="50" y="345" fill="#ccc" font-size="13" font-weight="500">User</text>
  <rect x="50" y="352" width="420" height="36" rx="6" fill="#1e1e3a" stroke="#4f46e5" stroke-width="2"/>
  <text x="65" y="375" fill="#fff" font-size="13">postgres.peqtogtlszfibszuyyeq</text>

  <!-- Password -->
  <text x="50" y="410" fill="#ccc" font-size="13" font-weight="500">Password</text>
  <rect x="50" y="417" width="420" height="36" rx="6" fill="#1e1e3a" stroke="#4f46e5" stroke-width="2"/>
  <text x="65" y="440" fill="#fff" font-size="13">••••••••••••••••</text>

  <!-- SSL -->
  <text x="50" y="475" fill="#ccc" font-size="13" font-weight="500">SSL</text>
  <rect x="50" y="482" width="160" height="36" rx="6" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="130" y="505" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="600">Disable</text>

  <!-- Test button -->
  <rect x="50" y="530" width="420" height="40" rx="8" fill="#22c55e"/>
  <text x="260" y="556" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">✅ Connection successful!</text>
</svg>
